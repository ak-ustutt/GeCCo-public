# Fortran flags
case $FC in
gfortran*)
	fopt_low="-O0"
	fopt_high="-O3"
	fopt="-O2"
	fcflags="-fdefault-integer-8 -fallow-argument-mismatch -fallow-invalid-boz -ffixed-line-length-132"
	fmodule="-J"
	fprof="-pg"
	fdebug="-O0 -g"
	frange=""
	fldflags=""
	;;
ifort)
	fopt_low="-O0"
	fopt_high="-O3"
	fopt="-O2"
	fcflags="-fpp -assume byterecl -i8"
	fmodule="-mod"
	fprof="-qp -assume byterecl -i8"
	fdebug="-g -assume byterecl -i8 -traceback"
	frange="-CB"
	fldflags=""
	;;
*)
	fcflags="-O2"
	finclude="-I/usr/local/include"
	fprof="-q"
	fdebug="-O0 -g"
	frange="-C"
	fldflags=""
	;;
esac

# C compiler flags
case $CC in
gcc*)
	cflags="-Wall"
	cdebug="-O0 -g"
	cprof="-pg"
	crange=""
	cldflags=""
	;;
icc)
	cflags="-O2 "
	cdebug="-O0 -g"
	cprof="-p"
	crange=""
	cldflags=""
	;;
*)
	cflags="-O2"
	cdebug="-O0 -g"
	cprof="-p"
	crange=""
	cldflags=""
	;;
esac
