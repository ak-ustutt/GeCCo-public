# Fortran flags
case $FC in
gfortran*)
	fcflags="-O2 -fallow-argument-mismatch -fdefault-integer-8 -ffixed-line-length-132"
        fmodule="-J"
	fprof="-q"
	fdebug="-g"
	frange="-C"
	fldflags=""
	;;
*)
	fcflags="-O2"
	fprof="-q"
	fdebug="-g"
	frange="-C"
	fldflags=""
	;;
esac

# C compiler flags
case $CC in
gcc*)
	# see config/arm64_apple.conf: pin back the C standard autoconf
	# bakes into $CC so the old-style K&R definitions in crout/*.c
	# compile.
	cflags="-O2 -Wall -fcommon -std=gnu17"
	cdebug="-g"
	cprof="-p"
	crange=""
	cldflags=""
	;;
*)
	cflags="-O2"
	cdebug="-g"
	cprof="-p"
	crange=""
	cldflags=""
	;;
esac

