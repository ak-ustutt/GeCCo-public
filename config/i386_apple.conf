# Fortran flags
case $FC in
pgf90)
	fcflags="-O3 -Bstatic -fastsse -Mipa=fast -i8 -Mpreprocess -Minform,warn"
        fmodule="-module"
	fprof="-pg -i8"
	fdebug="-O0 -g -Ktrap=fp -i8"
	frange="-C"
	fldflags=""
	;;

ifc)
	fcflags="-O2 -cm -w95 -fpp -i8"
        fmodule="-mod"
	fprof="-qp -i8"
	fdebug="-O0 -g -i8"
	frange="-C"
	fldflags="-Vaxlib"
	;;
ifort)
	fopt_low="-O0"
	fopt_high="-O3"
	fopt="-O2"
	fcflags="-fpp -assume byterecl -i8"
        fmodule="-mod"
	fprof="-qp -assume byterecl -i8"
	fdebug="-g -assume byterecl -i8 -traceback"
	frange="-CB"
	fldflags=""
	;;
gfortran*)
        fopt_low="-O0"
        fopt_high="-O3"
        fopt="-O2"
	fcflags="-arch x86_64 -fdefault-integer-8 -ffixed-line-length-132"
	fprof="-pg"
	fdebug="-O0 -g"
	frange=""
	fldflags=""
	;;
*)
	fcflags="-O2"
	finclude="-I/usr/local/include"
	fprof="-q"
	fdebug="-O0 -g"
	frange="-C"
	fldflags=""
	;;
esac
fcflags="$fcflags -DM_I686"
fdebug="$fdebug -DM_I686"

# C compiler flags
case $CC in
gcc*)
	# see arm64_apple.conf: pin back the C standard autoconf bakes
	# into $CC so the old-style K&R definitions in crout/*.c compile.
	cflags="-arch x86_64 -Wall -std=gnu17"
	cdebug="-arch x86_64 -O0 -g"
	cprof="-pg"
	crange=""
	cldflags=""
;;
icc)
	cflags="-O2 "
	cdebug="-O0 -g"
	cprof="-p"
	crange=""
	cldflags=""
;;
*)
	cflags="-O2"
	cdebug="-O0 -g"
	cprof="-p"
	crange=""
	cldflags=""
;;
esac

